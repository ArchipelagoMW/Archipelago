# These YAML documents are a tutorial of individual ChecksMate options, not the same thing as the "presets" dropdown
# on the player-options webpage (worlds/checksmate/presets.py). Several entries below share a name/theme with a
# preset there, but their values can differ intentionally: presets must generate successfully for every seed and
# every random army/early-material draw, while these examples are free to tune values (including locked_items) to
# one specific YAML.
description: 'Standard Chess pieces, moving in standard Chess ways, allowing many combinations of material'
name: NoDumbPieces
game: ChecksMate
ChecksMate:
  early_material: off # this allows the generator to work out its own logical progression
  fairy_chess_pieces: fide # this excludes all fairy chess pieces, although you may see many rooks, or no bishops, etc
  fairy_chess_pawns: vanilla # this excludes Berolina pawns, so every pawn will be a traditional pawn

---

description: 'A vanilla army with no pockets, comprising 2 Bishops+Knights+Rooks, and 1 Queen (or Rook until upgraded)'
name: Traditional
game: ChecksMate
ChecksMate:
  goal: single
  difficulty: daily
  enable_tactics: all
  early_material: pawn # not counted against locked_items (this may be changed)
  max_pocket: 0
  fairy_chess_pieces: fide
  fairy_chess_pawns: vanilla
  minor_piece_limit_by_type: 2
  major_piece_limit_by_type: 2
  queen_piece_limit: 1
  locked_items:
    Progressive Minor Piece: 4
    Progressive Major Piece: 3
    Progressive Major To Queen: 1

---

description: 'Horde Chess, but with random additional pieces'
name: OopsAllPawns
game: ChecksMate
ChecksMate:
  # Near-maximum locked pawns do not efficiently satisfy larger-board material targets.
  goal: single
  difficulty: relaxed # raises material requirement for goal far beyond just 32 pawns, therefore, player will get a lot
  early_material: pawn
  fairy_chess_pieces: betza
  fairy_chess_pawns: vanilla
  pocket_limit_by_pocket: 1
  locked_items:
    Progressive Pawn: 31 # the 32nd pawn is early material
    Progressive Pocket: 3

---

description: 'Chaos and pocket pieces'
name: SleevedAce
game: ChecksMate
ChecksMate:
  difficulty: daily
  piece_types: chaos
  early_material: major
  fairy_chess_pieces: betza
  fairy_chess_pawns:
    vanilla: 1
    berolina: 1
  locked_items:
    Progressive Pocket: 12

---

description: 'Weird Fairy Chess with opportunity to study the opening'
name: DifferentArmy
game: ChecksMate
ChecksMate:
  difficulty: daily
  piece_locations: stable
  piece_types: stable
  early_material: piece
  fairy_chess_pieces: configure
  fairy_chess_pieces_configure:
    - Rookies
    - Clobberers
    - Nutty
    - Camel
  fairy_chess_army: stable
  fairy_chess_pawns:
    vanilla: 20
    mixed: 1
    berolina: 8
  # Pool and Max fairy_chess_pawn_upgrades presets are deprecated in favor of Configure plus
  # Preference Priority/Preference Ratio (see the EvenHandedUpgrades example below) - they are kept
  # working for now but may be removed in a future update.
  fairy_chess_pawn_upgrades: configure
  piece_upgrade_preferences:
    - new-pawn
    - pool-pawn-upgrade
    - more-pawn
    - better-pawn
    - minor-to-major
    - major-to-jack
    - minor-to-jack
    - jack-to-queen
    - major-to-queen
    - queen-to-amazon

---

description: 'An even split between Minor and Major pawn upgrades, favored 1:2 over other upgrade paths'
name: EvenHandedUpgrades
game: ChecksMate
ChecksMate:
  difficulty: daily
  fairy_chess_pieces: fide
  fairy_chess_pawns: vanilla
  # Preference Priority and Preference Ratio both apply regardless of fairy_chess_pawn_upgrades mode,
  # and Preference Priority (when set) takes precedence over Piece Upgrade Preferences and any
  # legacy preset ordering. A priority of -1 disables that action entirely.
  fairy_chess_pawn_upgrades: "off"
  piece_upgrade_priority:
    pawn-to-minor: 2
    pawn-to-major: 2 # tied with pawn-to-minor above: an even split between Minor and Major upgrades
    new-pawn: 1
  # Preference Ratio governs how often each action is chosen relative to the others when the
  # generator draws a weighted/random upgrade - a 1:2 ratio here means pawn-to-major is picked
  # twice as often as minor-to-major.
  piece_upgrade_ratio:
    minor-to-major: 1
    pawn-to-major: 2
  fair_board_guarantee: standard_count

---

description: 'Many exotic royal pieces'
name: PowerCouples
game: ChecksMate
ChecksMate:
  difficulty: daily
  piece_types: chaos
  early_material: major
  max_kings: 3
  fairy_kings: 2
  fairy_chess_pieces: full
  fairy_chess_army: chaos
  fairy_chess_pawns:
    vanilla: 1
    berolina: 1
  minor_piece_limit_by_type: 1
  major_piece_limit_by_type: 1
  queen_piece_limit_by_type: 1
  locked_items:
    Progressive Consul: 2
    Progressive King Promotion: 2
    Progressive Major Piece: 2 # the 3rd is granted as Early Material!
    Progressive Major To Queen: 3


---

description: 'Skip the first half to learn the second half'
name: Endgame
game: ChecksMate
ChecksMate:
  goal: super
  difficulty: daily
  piece_types: chaos
  early_material: major
  max_kings: 3
  fairy_kings: 1
  fairy_chess_pieces: betza
  fairy_chess_army: chaos
  fairy_chess_pawns: vanilla
  start_inventory:
    Progressive Consul: 1
    Progressive Pawn: 6
    Progressive Minor Piece: 2
    Progressive Major Piece: 2
    Progressive Major To Queen: 1
