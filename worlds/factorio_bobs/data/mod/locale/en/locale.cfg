[mod-setting-description]
archipelago-death-link=Kill other players in the same Archipelago Multiworld that also have Death Link turned on, when you die.
archipelago-energy-link=Send and receive power to other players in the same Archipelago Multiworld that also have Energy Link turned on.
archipelago-progressive-technology-icons=The progressive factorio technologies will have all the icons of the entire progressive series.\nIf there is too much lag when opening the technology screen consider turning this setting down or off.\n\nTo change the setting for the server go to the mods folder and look for a mods-settings.dat file. In that file change the value of this setting in that document.\nInternal values are "never", "only-own" and "always"
archipelago-tech-layer-obscurity=Hide technologies until you have crafted all the science packs for the technology.\nWorks with Depth Obscurity
archipelago-tech-depth-obscurity=Hide technologies until you have come with in x amount of techs. 0 to disable.\nWorks with Layer Obscurity
archipelago-tech-craft-obscurity=Hide trigger techs based on crafting until you unlock the recipe to craft that item.

[string-mod-setting]
archipelago-progressive-technology-icons-never=Never
archipelago-progressive-technology-icons-only-own=Only your own
archipelago-progressive-technology-icons-always=Always

[string-mod-setting-description]
archipelago-progressive-technology-icons-never=Never show multiple icons in any factorio based progressive technologies.
archipelago-progressive-technology-icons-only-own=Only show multiple icons in your own progressive technologies.
archipelago-progressive-technology-icons-always=Always show multiple icons in progressive technologies, regardless of their origin.

