name: Pokemon HGSS Validation

on:
  pull_request:
    paths:
      - "worlds/pokemon_hgss/**"
      - ".github/workflows/pokemon_hgss_validation.yml"
  push:
    paths:
      - "worlds/pokemon_hgss/**"
      - ".github/workflows/pokemon_hgss_validation.yml"

permissions:
  contents: read

jobs:
  validate-hgss-data:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Pokemon HGSS world data
        run: |
          python -m worlds.pokemon_hgss.Validation