name: Publish macOS Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Application Bundle
        id: build_app
        run: |
          python setup.py --yes bdist_mac || true
          python setup.py bdist_mac
          app=$(ls -1dt build/*.app 2>/dev/null | head -n1 || true)
          if [ -z "$app" ]; then
            echo "No .app found in build/"
            exit 1
          fi
          echo "app_path=$app" >> $GITHUB_OUTPUT
          echo "Found $app"

      - name: Ad-hoc sign app
        run: |
          echo "Ad-hoc signing app..."
          app_path="${{ steps.build_app.outputs.app_path }}"
          if [ -z "$app_path" ]; then
            echo "No app path available from build step"
            exit 1
          fi
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Create DMG
        uses: L-Super/create-dmg-actions@v1
        with:
          dmg_name: 'Archipelago-Installer'
          src_dir: ${{ steps.build_app.outputs.app_path }}

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
