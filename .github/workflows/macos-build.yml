name: Build macOS DMG
on: [push, workflow_dispatch]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Application Bundle
        id: build_app
        run: |
          # Builds Archipelago.app into the build/ folder
          # install bonus deps
          python setup.py --yes bdist_mac || echo "This is fine"
          # do the build
          python setup.py bdist_mac
          # find the generated .app (pick newest) and expose as output for later steps
          app=$(ls -1dt build/*.app 2>/dev/null | head -n1 || true)
          if [ -z "$app" ]; then
            echo "No .app found in build/"
            exit 1
          fi
          echo "app_path=$app" >> $GITHUB_OUTPUT
          echo "Found $app"

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Archipelago-App
          path: build/*.app

      - name: Create DMG
        uses: L-Super/create-dmg-actions@v1
        with:
          dmg_name: 'Archipelago-Installer'
          src_dir: ${{ steps.build_app.outputs.app_path }}

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Archipelago-macOS-DMG
          path: ./*.dmg
