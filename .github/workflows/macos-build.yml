name: Build macOS DMG
on: [push, workflow_dispatch]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Application Bundle
        run: |
          # Builds Archipelago.app into the build/ folder
          # install bonus deps
          python setup.py --yes bdist_mac
          # do the build
          python setup.py bdist_mac

      - name: Create DMG
        uses: L-Super/create-dmg-actions@v1
        with:
          dmg_name: 'Archipelago-Installer'
          src_dir: 'build/Archipelago.app'
          additional_args: '--no-code-sign' 

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Archipelago-macOS-DMG
          path: ./*.dmg
